name: Asset-free source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check source boundary
        run: python3 tools/check_source_tree.py
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi clang make python3
      - name: Build and verify original-art skirmish
        run: make verify
      - name: Run host rule and renderer tests
        run: make test
